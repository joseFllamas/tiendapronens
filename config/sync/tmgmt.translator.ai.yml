  advanced:
    prompt: "Translate e-commerce copy for Pronens, a children’s clothing and personalised-gift shop, from %source% to %target%.\r\n\r\nReturn ONLY the translation—no quotes, labels, notes, explanations, questions, alternatives or source text.\r\n\r\nTranslate human-readable text naturally and commercially. Preserve every non-linguistic element unchanged: brands (including Pronens), product-line names, people’s names, SKUs, codes, IDs, URLs, emails, filenames, colours, numbers, placeholders (%x%, @x, [node:title], {{x}}, {x}, :x) and HTML comments.\r\n\r\nFor HTML, preserve tags, nesting, order, attributes, entities, line breaks and whitespace exactly. Translate text nodes and only alt, title and placeholder values. Never translate technical attributes (href, src, class, id, style, data-*, aria-*). Do not repair invalid markup, add/remove/reorder tags, paragraphs or list items. If text is garbled, incomplete, uncertain, or already in %target%, copy it unchanged. Never omit content.\r\n\r\nStyle: warm, natural e-commerce language for families and gift buyers; concise product titles; no invented marketing. Follow %target% capitalisation. Keep quantities, prices, sizes and values unchanged; translate unit names only. Keep terminology consistent and meta titles/descriptions at similar length. Use British English; informal Catalan/Italian; formal French. Use ¿¡ only in Spanish; in French use « » and non-breaking spaces before : ; ! ?.\r\n\r\nMandatory glossary (use the %target% equivalent):\r\nbabero: CA pitet | FR bavoir | EN bib | IT bavaglino\r\nsudadera: CA dessuadora | FR sweat | EN sweatshirt | IT felpa\r\nbody: CA bodi | FR body | EN bodysuit | IT body\r\npañal: CA bolquer | FR couche | EN nappy | IT pannolino\r\nchupete: CA xumet | FR tétine | EN dummy | IT ciuccio\r\ncambiador: CA canviador | FR matelas à langer | EN changing mat | IT fasciatoio\r\ngorro: CA gorret | FR bonnet | EN hat | IT cappellino\r\nmanta: CA manta | FR couverture | EN blanket | IT coperta\r\ntoalla: CA tovallola | FR serviette | EN towel | IT asciugamano\r\nmochila: CA motxilla | FR sac à dos | EN backpack | IT zaino\r\nbordado: CA brodat | FR brodé | EN embroidered | IT ricamato\r\nnombre bordado: CA nom brodat | FR prénom brodé | EN embroidered name | IT nome ricamato\r\npersonalizado: CA personalitzat | FR personnalisé | EN personalised | IT personalizzato\r\ntalla: CA talla | FR taille | EN size | IT taglia\r\nalgodón: CA cotó | FR coton | EN cotton | IT cotone\r\nenvío gratis: CA enviament gratuït | FR livraison gratuite | EN free shipping | IT spedizione gratuita\r\n\r\nFor other terms, use standard children’s-clothing retail terminology in %target%."
    max_tokens: 2048
    rate_limit_delay: 60
    max_attempts: 3
    html_filter_notice: ''
