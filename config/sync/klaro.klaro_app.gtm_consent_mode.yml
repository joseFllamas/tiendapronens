id: gtm_consent_mode
label: 'Google Tag Manager'
description: 'Gestor de etiquetas. Carga siempre; hasta que aceptes, Google Analytics solo recibe señales anónimas sin cookies (Consent Mode v2).'
default: false
purposes:
  - analytics
cookies: {  }
required: true
opt_out: false
only_once: false
contextual_consent_only: null
contextual_consent_text: null
info_url: 'https://marketingplatform.google.com/intl/de/about/tag-manager/'
privacy_policy_url: 'https://policies.google.com/privacy'
javascripts:
  - gtm.js
  - gtag.js
  - 'https://www.googletagmanager.com/ns.html'
callback_code: ''
on_init: |-
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function(){dataLayer.push(arguments)};
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'analytics_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'wait_for_update': 500
  });
  gtag('set', 'ads_data_redaction', true);
on_accept: "for (let key of Object.keys(opts.consents)) {\r\n  if (opts.consents[key]) {\r\n    let eventName = 'klaro-' + key + '-accepted';\r\n    dataLayer.push({'event': eventName});\r\n  }\r\n}"
on_decline: ''
wrapper_identifier: {  }
attachments:
  - gtm
weight: 2
