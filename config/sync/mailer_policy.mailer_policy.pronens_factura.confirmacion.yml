uuid: 7ed50543-12a8-4f80-b3b8-7f12e59f3040
langcode: es
status: true
dependencies: {  }
id: pronens_factura.confirmacion
configuration:
  email_subject:
    value: 'Tu factura {{ invoice_number }} de Pronens'
  email_body:
    content:
      value: |-
        <h1>Aquí tienes tu factura</h1>
        <p>Hola, te adjuntamos en PDF la factura <strong>{{ invoice_number }}</strong> de tu pedido <strong>#{{ order_number }}</strong>, por un total de <strong>{{ total }}</strong>.</p>
        {% if url_descarga %}
        <table class="pro-mail__btn-wrap" cellpadding="0" cellspacing="0" border="0" role="presentation"><tr><td>
          <table class="pro-mail__btn" cellpadding="0" cellspacing="0" border="0" role="presentation"><tr><td>
            <a class="pro-mail__btn-link" href="{{ url_descarga }}">Descargar la factura</a>
          </td></tr></table>
        </td></tr></table>
        <p class="pro-mail__note">También la tienes siempre a mano en <a href="{{ url_pedidos }}">Mis pedidos</a>.</p>
        {% endif %}
        <p class="pro-mail__note">Si necesitas la factura a nombre de una empresa o con otros datos, respóndenos a este correo y la rehacemos.</p>
      format: email_html
