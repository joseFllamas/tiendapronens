name: Pronens
type: theme
'base theme': false
version: 1.0.0
description: 'Tema custom de la tienda Pronens (rediseño minimal premium).'
core_version_requirement: ^11
generator: 'starterkit_theme:11.4.4'

libraries:
  - pronens/global
  - pronens/base
  - pronens/messages
  - core/normalize

libraries-override:
  # El correo lo viste el tema entero. Las hojas que symfony_mailer adjunta a
  # sus correos son las de su demo (azul #0e69be, bordes grises) y se inlinean
  # encima de las nuestras, así que se quitan en vez de pelearse con ellas.
  symfony_mailer/commerce_order: false
  symfony_mailer/contact: false

# Hoja de estilo de los PDF (facturas). entity_print la lee SIEMPRE del tema por
# defecto, sea cual sea el tema activo al generar el fichero.
entity_print:
  all:
    - pronens/factura

libraries-extend:
  user/drupal.user:
    - pronens/user
  core/drupal.dropbutton:
    - pronens/dropbutton
  core/drupal.dialog:
    - pronens/dialog
  file/drupal.file:
    - pronens/file
  core/drupal.item-list:
    - pronens/item-list
  core/drupal.progress:
    - pronens/progress
  core/drupal.tablesort:
    - pronens/drupal.tablesort

regions:
  marquee: 'Marquee de avisos'
  header: 'Cabecera (logo)'
  primary_menu: 'Menú principal'
  header_actions: 'Cabecera (acciones)'
  breadcrumb: 'Migas de pan'
  highlighted: 'Destacado (mensajes)'
  help: 'Ayuda'
  content: 'Contenido'
  footer: 'Pie de página'
  footer_legal: 'Pie de página (legal)'
