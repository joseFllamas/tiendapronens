name: 'Pronens: correo'
type: module
description: 'Viste el correo saliente con la identidad de la tienda: adjunta la hoja de estilo de correo del tema, resuelve el idioma del destinatario y añade el aviso de expedición con el seguimiento de Correos Express.'
package: Pronens
core_version_requirement: ^11
dependencies:
  - symfony_mailer:symfony_mailer
  - symfony_mailer:mailer_policy
  - drupal:config_translation
