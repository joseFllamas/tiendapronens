id: pronens_taxonomia_edades
label: 'Pronens: taxonomía Edades'
migration_tags:
  - 'Drupal 7'
  - Pronens
migration_group: pronens
audit: true
source:
  plugin: d7_taxonomy_term
  key: migrate
  bundle: edades
process:
  vid:
    plugin: default_value
    default_value: edades
  # Solo términos en castellano o sin idioma definido. En el D7 las traducciones
  # son términos independientes, no traducciones de la misma entidad, y sin este
  # filtro entran como si fuesen castellanos: 47 de los 77 de tipo_de_producto
  # y 12 de los 16 de recomendaciones_de_lavado lo eran.
  langcode:
    -
      plugin: skip_on_value
      source: language
      not_equals: true
      method: row
      value:
        - es
        - und
      message: 'Término en otro idioma: solo se migra castellano.'
    -
      plugin: static_map
      map:
        es: es
        und: es
  name: name
  description/value: description
  description/format:
    plugin: default_value
    default_value: basic_html
  weight: weight
  parent_id:
    -
      plugin: skip_on_empty
      method: process
      source: parent
    -
      # Sin no_stub, migrate intenta crear un stub del padre cuando el hijo se
      # procesa primero. El stub no lleva las propiedades de origen, así que el
      # filtro de idioma lo descarta y arrastra al hijo. Con no_stub el término
      # queda temporalmente sin padre y una segunda pasada con --update lo
      # resuelve, cuando ya todos los términos están en el mapa.
      plugin: migration_lookup
      migration: pronens_taxonomia_edades
      no_stub: true
  parent:
    plugin: default_value
    default_value: 0
    source: '@parent_id'
destination:
  plugin: 'entity:taxonomy_term'
  default_bundle: edades
