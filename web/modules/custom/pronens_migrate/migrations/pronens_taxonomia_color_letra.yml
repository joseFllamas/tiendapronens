id: pronens_taxonomia_color_letra
label: 'Pronens: colores de letra del bordado, con su muestra'
migration_tags:
  - 'Drupal 7'
  - Pronens
migration_group: pronens
audit: true
source:
  plugin: d7_taxonomy_term
  key: migrate
  bundle: color_letra
process:
  vid:
    plugin: default_value
    default_value: color_letra
  # Solo términos en castellano o sin idioma definido. En el D7 las traducciones
  # son términos independientes, no traducciones de la misma entidad, y sin este
  # filtro entran como si fuesen castellanos: 47 de los 77 de tipo_de_producto
  # y 12 de los 16 de recomendaciones_de_lavado lo eran.
  langcode:
    -
      plugin: skip_on_value
      source: language
      not_equals: true
      method: row
      value:
        - es
        - und
      message: 'Término en otro idioma: solo se migra castellano.'
    -
      plugin: static_map
      map:
        es: es
        und: es
  name: name
  description/value: description
  description/format:
    plugin: default_value
    default_value: basic_html
  weight: weight
  # Estos términos son bicolores ("perfil blanco interior rojo"), así que un
  # código hex no los representa: la muestra tiene que ser una imagen.
  field_imagen/target_id:
    plugin: migration_lookup
    migration: pronens_media_imagen
    source: field_imagen/0/fid
    no_stub: true
destination:
  plugin: 'entity:taxonomy_term'
  default_bundle: color_letra
migration_dependencies:
  required:
    - pronens_media_imagen
