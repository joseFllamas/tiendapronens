id: pronens_alias_pagina
label: 'Pronens: alias de URL de las páginas'
migration_tags:
  - 'Drupal 7'
  - Pronens
migration_group: pronens
audit: true
source:
  plugin: pronens_d7_url_alias
  key: migrate
  path_prefix: 'node/'
  constants:
    prefijo_destino: '/node/'
process:
  # Solo resuelve para las cuatro páginas migradas; el resto de alias de nodo ya
  # los cubre pronens_alias_producto.
  pagina_id:
    -
      plugin: migration_lookup
      migration: pronens_pagina
      source: entity_id
      no_stub: true
    -
      plugin: skip_on_empty
      method: row
  path:
    plugin: concat
    source:
      - constants/prefijo_destino
      - '@pagina_id'
  alias: alias_con_barra
  langcode:
    plugin: default_value
    default_value: es
destination:
  plugin: 'entity:path_alias'
migration_dependencies:
  required:
    - pronens_pagina
