id: pronens_taxonomia_escuelas
label: 'Pronens: taxonomía Escuelas'
migration_tags:
  - 'Drupal 7'
  - Pronens
migration_group: pronens
audit: true
source:
  plugin: d7_taxonomy_term
  key: migrate
  bundle: escuelas
process:
  vid:
    plugin: default_value
    default_value: escuelas
  langcode:
    plugin: default_value
    default_value: es
  name: name
  description/value: description
  description/format:
    plugin: default_value
    default_value: basic_html
  weight: weight
  parent_id:
    -
      plugin: skip_on_empty
      method: process
      source: parent
    -
      plugin: migration_lookup
      migration: pronens_taxonomia_escuelas
  parent:
    plugin: default_value
    default_value: 0
    source: '@parent_id'
destination:
  plugin: 'entity:taxonomy_term'
  default_bundle: escuelas
