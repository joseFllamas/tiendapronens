pronens_personalizacion.settings:
  type: config_object
  label: 'Ajustes de personalización del bordado'
  mapping:
    recargo:
      type: mapping
      label: 'Recargo por bordado aplicado por defecto'
      mapping:
        number:
          type: string
          label: 'Importe'
        currency_code:
          type: string
          label: 'Moneda'
    longitud_maxima:
      type: integer
      label: 'Longitud máxima del texto a bordar'
