# Monta los ficheros del Drupal 7 origen en solo lectura, para que las
# migraciones de ficheros y Media puedan copiarlos sin duplicar 1,6 GB.
# El proyecto origen es /Users/josellamas/var/www/tiendapronens (DDEV
# "tiendapronens", docroot www). Se puede borrar cuando la migración termine.
services:
  web:
    volumes:
      # Se monta replicando la estructura del docroot origen, porque el plugin
      # d7_file construye la ruta como source_base_path + file_public_path, y
      # en el D7 file_public_path es "sites/default/files".
      - "/Users/josellamas/var/www/tiendapronens/www/sites/default/files:/mnt/d7/sites/default/files:ro"
